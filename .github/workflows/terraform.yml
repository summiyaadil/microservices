name: 'Infrastructure & Application'

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    name: 'Terraform'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, prod]
    defaults:
      run:
        working-directory: environments/${{ matrix.environment }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Azure Login
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: "1.13.5"

    - name: Terraform Init
      run: terraform init

    - name: Terraform Plan
      id: plan
      run: terraform plan -no-color -input=false

    - name: Terraform Apply
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      run: terraform apply -auto-approve -input=false

  deploy-app:
    name: 'Build & Deploy App'
    needs: terraform
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [dev] # Starting with dev for the app deployment
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Azure Login
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Get ACR Name
      id: get_acr
      run: |
        # Extract ACR name from terraform vars or state. 
        # For simplicity, we use the known pattern: projectnameenvacr
        # In a real scenario, you'd use terraform output.
        PROJECT_NAME=$(grep "project_name" environments/${{ matrix.environment }}/terraform.tfvars | cut -d'=' -f2 | tr -d ' "' | xargs)
        ENV_NAME=$(grep "env" environments/${{ matrix.environment }}/terraform.tfvars | cut -d'=' -f2 | tr -d ' "' | xargs)
        echo "acr_name=${PROJECT_NAME}${ENV_NAME}acr" >> $GITHUB_OUTPUT
        echo "resource_group=${PROJECT_NAME}-${ENV_NAME}-rg" >> $GITHUB_OUTPUT
        echo "aks_name=${PROJECT_NAME}-${ENV_NAME}-aks" >> $GITHUB_OUTPUT

    - name: Build and Push to ACR
      run: |
        az acr login --name ${{ steps.get_acr.outputs.acr_name }}
        docker build -t ${{ steps.get_acr.outputs.acr_name }}.azurecr.io/sample-app:${{ github.sha }} ./app
        docker push ${{ steps.get_acr.outputs.acr_name }}.azurecr.io/sample-app:${{ github.sha }}

    - name: Get AKS Credentials
      run: |
        az aks get-credentials --resource-group ${{ steps.get_acr.outputs.resource_group }} --name ${{ steps.get_acr.outputs.aks_name }}

    - name: Deploy to AKS
      run: |
        export ACR_NAME=${{ steps.get_acr.outputs.acr_name }}
        export IMAGE_TAG=${{ github.sha }}
        envsubst < app/k8s/deployment.yaml | kubectl apply -f -
