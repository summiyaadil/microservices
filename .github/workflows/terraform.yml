name: 'Terraform Infrastructure CI/CD'

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  id-token: write
  contents: read

jobs:
  build:
    name: 'Build'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, prod]
    defaults:
      run:
        working-directory: environments/${{ matrix.environment }}
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_USE_OIDC: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.13.5"

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan -out=tfplan -input=false

      - name: Upload Plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ matrix.environment }}
          path: environments/${{ matrix.environment }}/tfplan

  scan:
    name: 'Scan'
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, prod]
    defaults:
      run:
        working-directory: environments/${{ matrix.environment }}
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_USE_OIDC: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog OSS
        # Run only once to avoid redundancy
        if: matrix.environment == 'dev'
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.50.0

      - name: TFLint Init
        run: tflint --init --config ../../.tflint.hcl

      - name: TFLint Run
        run: tflint --config ../../.tflint.hcl

      - name: TFSec
        uses: aquasecurity/tfsec-action@v1.0.0
        with:
          working_directory: environments/${{ matrix.environment }}

      - name: Download Plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ matrix.environment }}
          path: environments/${{ matrix.environment }}

      # - name: Infracost Setup
      #   uses: infracost/actions/setup@v3
      #   with:
      #     api-key: ${{ secrets.INFRACOST_API_KEY }}

      # - name: Infracost Breakdown
      #   run: infracost breakdown --path tfplan --format json --out-file infracost.json
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Terratest
        run: |
          cd ../../test
          go test -v -timeout 30m

  deploy:
    name: 'Deploy'
    needs: scan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, prod]
    defaults:
      run:
        working-directory: environments/${{ matrix.environment }}
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_USE_OIDC: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.13.5"

      - name: Download Plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ matrix.environment }}
          path: environments/${{ matrix.environment }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

  deploy-app:
    name: 'Build & Deploy App'
    needs: deploy
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Azure Login
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Get ACR Name
      id: get_acr
      run: |
        PROJECT_NAME=$(grep "project_name" environments/dev/terraform.tfvars | cut -d'=' -f2 | tr -d ' "' | xargs)
        ENV_NAME=$(grep "env" environments/dev/terraform.tfvars | cut -d'=' -f2 | tr -d ' "' | xargs)
        echo "acr_name=${PROJECT_NAME}${ENV_NAME}acr" >> $GITHUB_OUTPUT
        echo "resource_group=${PROJECT_NAME}-${ENV_NAME}-rg" >> $GITHUB_OUTPUT
        echo "aks_name=${PROJECT_NAME}-${ENV_NAME}-aks" >> $GITHUB_OUTPUT

    - name: Build and Push to ACR
      run: |
        az acr login --name ${{ steps.get_acr.outputs.acr_name }}
        docker build -t ${{ steps.get_acr.outputs.acr_name }}.azurecr.io/sample-app:${{ github.sha }} ./app
        docker push ${{ steps.get_acr.outputs.acr_name }}.azurecr.io/sample-app:${{ github.sha }}

    - name: Get AKS Credentials
      run: |
        az aks get-credentials --resource-group ${{ steps.get_acr.outputs.resource_group }} --name ${{ steps.get_acr.outputs.aks_name }}

    - name: Deploy to AKS
      run: |
        export ACR_NAME=${{ steps.get_acr.outputs.acr_name }}
        export IMAGE_TAG=${{ github.sha }}
        envsubst < app/k8s/deployment.yaml | kubectl apply -f -
